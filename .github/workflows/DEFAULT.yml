#CI项目
name: DEFAULT
run-name: ${{ inputs.WRT_DEVICE }}-${{ inputs.SOURCE_TYPE }}-${{ inputs.WRT_FIREWALL == 'auto' && (inputs.SOURCE_TYPE == 'lean' && 'fw3' || 'fw4') || inputs.WRT_FIREWALL }}-${{ inputs.WRT_OVERLAYS != '' && inputs.WRT_OVERLAYS || 'base' }}

on:
  workflow_call:
    inputs:
      WRT_DEVICE:
        required: true
        type: string
      SOURCE_TYPE:
        required: false
        type: string
        default: 'lean'
      WRT_FIREWALL:
        required: false
        type: string
        default: 'auto'
      WRT_OVERLAYS:
        required: false
        type: string
        default: ''
      WRT_LUCI_BRANCH:
        required: false
        type: string
        default: ''
      WRT_DIY_SETTING:
        required: false
        type: string
        default: 'diy_config.sh'
      WRT_DIYPackages:
        required: false
        type: string
        default: 'auto'
      WRT_DEFAULT_LANIP:
        required: false
        type: string
        default: '192.168.0.1'
      WRT_RELEASE_FIRMWARE:
        required: false
        type: boolean
        default: true
      WHAT_MY_SAY:
        required: false
        type: string
        default: ''
      WRT_SOURCE_HASH_INFO:
        required: false
        type: string
        default: ''
    secrets:
      DINGDING_TOKEN:
        required: false
  #手动编译
  workflow_dispatch:
    inputs:
      WRT_DEVICE:
        description: '设备型号'
        required: true
        type: choice
        options:
          - CMIOT-AX18-NOWIFI
          - JD-AX1800PRO-WIFI
          - JD-AX6600-WIFI
          - GL-MT6000-WIFI
        default: 'CMIOT-AX18-NOWIFI'
      SOURCE_TYPE:
        description: '源码类型（vwrt=immortalwrt，lean=coolsnowwolf/lede）'
        required: false
        type: choice
        options:
          - vwrt
          - lean
        default: 'lean'
      WRT_FIREWALL:
        description: '防火墙栈（auto=按源码类型自动选择，lean→fw3，vwrt→fw4）'
        required: false
        type: choice
        options:
          - auto
          - fw3
          - fw4
        default: 'auto'
      WRT_OVERLAYS:
        description: '可选 overlays，逗号分隔，例如 frps'
        required: false
        type: string
        default: ''
      WRT_USE_APK:
        description: '包管理器（auto=按源码类型自动选择，true=强制apk，false=强制ipk）'
        required: false
        type: choice
        options:
          - auto
          - 'true'
          - 'false'
        default: 'auto'
      WRT_LUCI_BRANCH:
        description: '可选 LuCI feed 分支，例如 openwrt-23.05、23.05 或 2305；'
        required: false
        type: string
        default: ''
      WRT_DIY_SETTING:
        description: 'diy_setting脚本'
        required: false
        type: string
        default: 'diy_config.sh'
      WRT_DIYPackages:
        description: 'DIY包配置'
        required: false
        type: string
        default: 'auto'
      WRT_DEFAULT_LANIP:
        description: '默认LAN-IP'
        required: false
        type: string
        default: '192.168.0.1'
      WRT_RELEASE_FIRMWARE:
        description: '发布firmware'
        required: false
        type: boolean
        default: true
      WHAT_MY_SAY:
        description: '编译说明'
        required: false
        type: string
        default: ''
      WRT_SOURCE_HASH_INFO:
        description: '源码 HASH，可选填写 commit hash'
        required: false
        type: string
        default: ''

#CI权限
permissions: write-all

#CI任务
jobs:
  # 预解析：根据 SOURCE_TYPE 解析 auto 为实际值
  resolve:
    name: 解析配置
    runs-on: ubuntu-22.04
    outputs:
      firewall: ${{ steps.resolve.outputs.firewall }}
      use_apk: ${{ steps.resolve.outputs.use_apk }}
      pkg_mgr: ${{ steps.resolve.outputs.pkg_mgr }}
    steps:
      - name: Resolve auto values
        id: resolve
        run: |
          source_type="${{ inputs.SOURCE_TYPE }}"
          firewall="${{ inputs.WRT_FIREWALL }}"
          use_apk="${{ inputs.WRT_USE_APK }}"

          # vwrt → fw4 / apk，lean → fw3 / ipk
          if [ "$firewall" = "auto" ]; then
            if [ "$source_type" = "vwrt" ]; then
              firewall="fw4"
            else
              firewall="fw3"
            fi
          fi
          if [ "$use_apk" = "auto" ]; then
            if [ "$source_type" = "vwrt" ]; then
              use_apk="true"
            else
              use_apk="false"
            fi
          fi

          echo "firewall=$firewall" >> $GITHUB_OUTPUT
          echo "use_apk=$use_apk" >> $GITHUB_OUTPUT
          if [ "$use_apk" = "true" ]; then
            echo "pkg_mgr=apk" >> $GITHUB_OUTPUT
          else
            echo "pkg_mgr=ipk" >> $GITHUB_OUTPUT
          fi
          echo "【Lin】源码类型：${source_type}"
          echo "【Lin】解析结果：fw=${firewall}, apk=${use_apk}"

  config:
    needs: resolve
    name: ${{ inputs.WRT_DEVICE }}-${{ needs.resolve.outputs.firewall }}-${{ needs.resolve.outputs.pkg_mgr }}-${{ inputs.WRT_OVERLAYS != '' && inputs.WRT_OVERLAYS || 'base' }}
    # 调用公用编译核心ALL-CORE.yml
    uses: ./.github/workflows/CORE-ALL.yml
    with:
      # 参数化配置
      WRT_DEVICE: ${{ inputs.WRT_DEVICE }}
      # 源码类型：vwrt 或 lean
      SOURCE_TYPE: ${{ inputs.SOURCE_TYPE }}
      # 指定源码HASH信息，默认空
      WRT_SOURCE_HASH_INFO: ${{ inputs.WRT_SOURCE_HASH_INFO }}
      # 防火墙栈：fw3 或 fw4，从SOURCE_TYPE获取
      WRT_FIREWALL: ${{ needs.resolve.outputs.firewall }}
      # 包管理器：apk 或 ipk，从SOURCE_TYPE获取
      WRT_USE_APK: ${{ needs.resolve.outputs.use_apk }}
      # overlays，例如 frps
      WRT_OVERLAYS: ${{ inputs.WRT_OVERLAYS }}
      # LuCI feed 分支，例如 openwrt-23.05、23.05 或 2305
      WRT_LUCI_BRANCH: ${{ inputs.WRT_LUCI_BRANCH }}
      # DIY脚本，会自动判断源码进行处理
      WRT_DIY_SETTING: ${{ inputs.WRT_DIY_SETTING }}
      # DIY包配置，会自动判断源码进行处理
      WRT_DIYPackages: ${{ inputs.WRT_DIYPackages }}
      # FEED配置
      WRT_DIY_FEEDS: diy_feeds.sh
      # 是否发布
      WRT_RELEASE_FIRMWARE: ${{ inputs.WRT_RELEASE_FIRMWARE }}
      # 默认LAN-IP
      WRT_DEFAULT_LANIP: ${{ inputs.WRT_DEFAULT_LANIP }}
      # 钉钉TOKEN，用于推送下载文件
      WRT_TOKEN_DINGDING: ${{ inputs.iTOKEN_DINGDING }}
      # 编译说明
      WRT_MINE_SAY: ${{ inputs.WHAT_MY_SAY }}
    secrets:
      DINGDING_TOKEN: ${{ secrets.DINGDING_TOKEN }}

